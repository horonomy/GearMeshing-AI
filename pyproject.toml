[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gearmeshing-ai"
version = "0.0.0"
description = "Governed autonomous engineering teams powered by Agent Assembly"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "anyio>=4.14,<5",
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "typer>=0.27,<1",
]

[project.scripts]
gmai = "gearmeshing_ai.interfaces.cli:app"

[project.urls]
Homepage = "https://github.com/horonomy/GearMeshing-AI"
Issues = "https://github.com/horonomy/GearMeshing-AI/issues"
Repository = "https://github.com/horonomy/GearMeshing-AI"

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["gearmeshing_ai"]

[tool.hatch.build.targets.sdist]
include = ["gearmeshing_ai", "test", "README.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["fixtures/sample_service"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^fixtures/sample_service/"]
